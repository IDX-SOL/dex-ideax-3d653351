<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/favicon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="apple-touch-icon" href="/favicon.webp" />

    <link
      rel="preload"
      as="image"
      href="/exchange-home/hero-bg.webp"
      type="image/webp"
      fetchpriority="high"
    />

    <link
      rel="preload"
      href="/fonts/Manrope/Manrope-Medium.ttf"
      as="font"
      type="font/ttf"
      crossorigin=""
    />

    <title>IDX Exchange - Decentralized Crypto Perpetual Futures (Perp) Exchange</title>

    <meta
      name="description"
      content="Trade crypto perpetual futures on IDX Exchange, a decentralized perp exchange with no KYC, up to 100x leverage, non-custodial trading, deep liquidity, low fees, and seamless on-chain derivatives."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://dex.idxsolana.io/" />

    <!-- Static OG tags for WhatsApp/Telegram/Twitter crawlers (no JS) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dex.idxsolana.io" />
    <meta
      property="og:title"
      content="IDX Exchange - Decentralized Crypto Perpetual Futures (Perp) Exchange"
    />
    <meta
      property="og:description"
      content="Trade crypto perpetual futures on IDX Exchange, a decentralized perp exchange with no KYC, up to 100x leverage, non-custodial trading, deep liquidity, low fees, and seamless on-chain derivatives."
    />
    <meta property="og:image" content="https://dex.idxsolana.io/og-image.jpg" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="538" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@IDX_SOLANA" />
    <meta
      name="twitter:title"
      content="IDX Exchange - Decentralized Crypto Perpetual Futures (Perp) Exchange"
    />
    <meta
      name="twitter:description"
      content="Trade crypto perpetual futures on IDX Exchange, a decentralized perp exchange with no KYC, up to 100x leverage, non-custodial trading, deep liquidity, low fees, and seamless on-chain derivatives."
    />
    <meta name="twitter:image" content="https://dex.idxsolana.io/og-image.jpg" />

    <!-- Home-only static hero: LCP paints before React (removed on ExchangeHomePage mount) -->
    <style>
      body {
        margin: 0;
        background: #050506;
      }

      #idx-static-hero {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background: #050506;
        overflow: hidden;
      }

      html.idx-static-hero-active #idx-static-hero {
        display: block;
      }

      html.idx-static-hero-active #root {
        position: relative;
        z-index: 1;
        min-height: 100svh;
      }

      .idx-static-hero__bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 64% center;
      }

      .idx-static-hero__overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          rgba(5, 5, 6, 0.93) 0%,
          rgba(5, 5, 6, 0.8) 36%,
          rgba(5, 5, 6, 0.4) 58%,
          rgba(5, 5, 6, 0.1) 100%
        );
      }
    </style>
    <script>
      (function () {
        function normalizePath(path) {
          if (!path || path === "/") return "/";
          return path.endsWith("/") ? path.slice(0, -1) : path;
        }

        var base = normalizePath(
          document.documentElement.getAttribute("data-base") || "/",
        );
        var path = normalizePath(location.pathname);
        if (path === base) {
          document.documentElement.classList.add("idx-static-hero-active");
        }
      })();
    </script>
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N5DRLDC5"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div id="idx-static-hero" aria-hidden="true">
      <img
        class="idx-static-hero__bg"
        src="/exchange-home/hero-bg.webp"
        alt=""
        width="1024"
        height="571"
        decoding="async"
        fetchpriority="high"
      />
      <div class="idx-static-hero__overlay"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/app/main.tsx"></script>
  </body>
</html>
