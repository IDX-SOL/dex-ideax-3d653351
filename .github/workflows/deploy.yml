name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  check-prerequisites:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.check_merge.outputs.should_skip }}
    steps:
      - name: Check if triggered by merge commit
        id: check_merge
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            if (context.eventName !== 'push') {
              core.setOutput('should_skip', 'false');
              return;
            }
            const commit = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha
            });
            const isMerge = commit.data.parents.length > 1;
            if (isMerge) {
              console.log('Triggered by merge commit, skipping workflow to prevent loop');
              core.setOutput('should_skip', 'true');
            } else {
              core.setOutput('should_skip', 'false');
            }

  build-and-deploy:
    needs: check-prerequisites
    if: needs.check-prerequisites.outputs.should_skip != 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: |
            yarn.lock

      - name: Cache node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            node_modules
            ~/.yarn/cache
          key: ${{ runner.os }}-deps-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Extract repository name
        run: echo "REPO_NAME=$(echo ${{ github.repository }} | cut -d'/' -f2)" >> $GITHUB_ENV

      - name: Check for custom domain
        id: check-custom-domain
        run: |
          if [ -f "CNAME" ]; then
            echo "has_custom_domain=true" >> $GITHUB_OUTPUT
            echo "Found custom domain: $(cat CNAME)"
          else
            echo "has_custom_domain=false" >> $GITHUB_OUTPUT
            echo "No custom domain configured"
          fi

      - name: Install dependencies
        run: yarn install --frozen-lockfile --prefer-offline

      - name: Build with repository base path
        if: steps.check-custom-domain.outputs.has_custom_domain == 'false'
        run: yarn build:spa
        env:
          # Set the base path for GitHub Pages using repo name
          PUBLIC_PATH: /${{ env.REPO_NAME }}/
          # Also set it as VITE environment variables
          VITE_PUBLIC_PATH: /${{ env.REPO_NAME }}/
          VITE_BASE_URL: /${{ env.REPO_NAME }}

      - name: Build with root base path (for custom domain)
        if: steps.check-custom-domain.outputs.has_custom_domain == 'true'
        run: yarn build:spa
        env:
          # For custom domains, use root path
          PUBLIC_PATH: /
          VITE_PUBLIC_PATH: /
          VITE_BASE_URL: ""

      - name: Setup Pages
        uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d # v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: "./build/client"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
